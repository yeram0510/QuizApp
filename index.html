<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>퀴즈</title>
  <script>
  
  function makeSample(subject){
    return {
      subject,
      questions: Array.from({length:10},(_,i)=>({
        name:`${subject} 문제 내용${i+1}`,
        answers:[0,1,2,3].map(k=>({content:`답변${k+1}`,isAnswer:k===i%4}))
      }))
    };
  }
  const quizData = ["상식","역사","영화","성경"].map(makeSample);
  
  </script>
  <style>
  :root{
    --bg:#f5f5f5; --surface:#ffffff; --text:#242424; --text2:#616161;
    --stroke:#d1d1d1; --stroke2:#e0e0e0;
    --brand:#0f6cbd; --brand-h:#115ea3; --brand-p:#0f548c; --brand-bg:#ebf3fc; --on-brand:#ffffff;
    --ok:#107c10; --ok-bg:#f1faf1; --err:#b10e1c; --err-bg:#fdf3f4;
    --shadow:0 1px 2px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
    --shadow-h:0 4px 8px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1f1f1f; --surface:#292929; --text:#ffffff; --text2:#adadad;
      --stroke:#666666; --stroke2:#424242;
      --brand:#479ef5; --brand-h:#62abf5; --brand-p:#2886de; --brand-bg:#0c3b5e; --on-brand:#1f1f1f;
      --ok:#54b054; --ok-bg:#0e280e; --err:#dc626d; --err-bg:#3b0509;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
      --shadow-h:0 4px 8px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1f1f1f; --surface:#292929; --text:#ffffff; --text2:#adadad;
    --stroke:#666666; --stroke2:#424242;
    --brand:#479ef5; --brand-h:#62abf5; --brand-p:#2886de; --brand-bg:#0c3b5e; --on-brand:#1f1f1f;
    --ok:#54b054; --ok-bg:#0e280e; --err:#dc626d; --err-bg:#3b0509;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
    --shadow-h:0 4px 8px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Segoe UI Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
    font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  }
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  
  .app{width:100%;max-width:720px;margin:0 auto;padding:32px 16px}
  h1{font-size:28px;line-height:1.3;font-weight:600;margin:0 0 8px}
  .lead{color:var(--text2);margin:0 0 24px}
  
  /* 버튼 */
  .btn{
    min-height:44px;padding:0 24px;border-radius:4px;border:1px solid var(--stroke);
    background:var(--surface);font-weight:600;cursor:pointer;
    transition:background .1s,border-color .1s;
  }
  .btn:hover{background:var(--bg)}
  .btn:active{background:var(--stroke2)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .btn.primary:hover{background:var(--brand-h);border-color:var(--brand-h)}
  .btn.primary:active{background:var(--brand-p);border-color:var(--brand-p)}
  
  /* 주제 선택 */
  .subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .subject{
    text-align:center;min-height:96px;padding:16px 20px;border:1px solid var(--stroke2);border-radius:8px;
    background:var(--surface);box-shadow:var(--shadow);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:border-color .1s,box-shadow .1s;
  }
  .subject:hover{border-color:var(--brand);box-shadow:var(--shadow-h)}
  .subject:active{background:var(--brand-bg)}
  .subject .name{font-size:20px;font-weight:600}
  
  /* 문제 */
  .qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14px;color:var(--text2)}
  .qhead .count{font-weight:600;color:var(--text)}
  .progress{height:4px;border-radius:2px;background:var(--stroke2);overflow:hidden;margin-bottom:24px}
  .progress>div{height:100%;background:var(--brand);transition:width .25s}
  .qcard{background:var(--surface);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:24px}
  .qtext{font-size:22px;line-height:1.5;font-weight:600;margin:0 0 20px}
  .options{display:grid;gap:10px;margin:0;padding:0;list-style:none}
  .option{
    width:100%;min-height:56px;padding:10px 16px;border:1px solid var(--stroke);border-radius:8px;
    background:var(--surface);display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
    transition:background .1s,border-color .1s,opacity .15s;
  }
  .option:hover:not(:disabled){background:var(--brand-bg);border-color:var(--brand)}
  .option:active:not(:disabled){background:var(--stroke2)}
  .option:disabled{cursor:default}
  .option .letter{
    flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--stroke);
    display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text2)
  }
  .option .label{flex:1}
  .option .mark{flex:none;font-weight:700;font-size:18px;min-width:20px;text-align:center}
  .option.correct{border-color:var(--ok);background:var(--ok-bg);border-width:2px}
  .option.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .option.correct .mark{color:var(--ok)}
  .option.wrong{border-color:var(--err);background:var(--err-bg);border-width:2px}
  .option.wrong .letter{background:var(--err);border-color:var(--err);color:var(--surface)}
  .option.wrong .mark{color:var(--err)}
  .option.dim{opacity:.55}
  .footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;min-height:48px}
  .feedback{font-weight:600}
  .feedback.ok{color:var(--ok)}
  .feedback.err{color:var(--err)}
  .footer .btn{min-height:48px;margin-left:auto}
  
  /* 결과 */
  .result{background:var(--surface);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:40px 24px;text-align:center}
  .badge{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:36px;font-weight:700;color:var(--surface)}
  .badge.pass{background:var(--ok)}
  .badge.fail{background:var(--err)}
  .result h1{margin-bottom:4px}
  .result .score{font-size:18px;margin:0 0 4px}
  .result .rule{color:var(--text2);font-size:14px;margin:0 0 28px}
  
  @media (max-width:480px){
    .qtext{font-size:19px}
    h1{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <section id="home">
      <h1>주제를 선택해 주세요</h1>
      <p class="lead" id="homeLead"></p>
      <div class="subjects" id="subjectList"></div>
    </section>
  
    <section id="quiz" hidden>
      <div class="qhead"><span id="qSubject"></span><span class="count" id="qCount"></span></div>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
      <div class="qcard">
        <p class="qtext" id="qText"></p>
        <ul class="options" id="options"></ul>
      </div>
      <div class="footer">
        <span class="feedback" id="feedback" role="status" aria-live="polite"></span>
        <button class="btn primary" id="nextBtn" type="button" hidden></button>
      </div>
    </section>
  
    <section id="result" hidden>
      <div class="result">
        <div class="badge" id="badge" aria-hidden="true"></div>
        <h1 id="resultTitle"></h1>
        <p class="score" id="resultScore"></p>
        <p class="rule" id="resultRule"></p>
        <button class="btn primary" id="homeBtn" type="button">처음으로</button>
      </div>
    </section>
  </main>
  
  <script>
  // 주제당 랜덤 출제 문제 수
  const QUESTION_COUNT = 5;
  // 성공 기준(정답 수)
  const PASS_SCORE = 3;      
  const LETTERS = "ABCD";
  
  const $ = id => document.getElementById(id);
  const screens = {home:$("home"), quiz:$("quiz"), result:$("result")};
  let state = null;
  
  function show(name){
    for(const k in screens) screens[k].hidden = (k !== name);
    window.scrollTo(0,0);
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  
  function renderHome(){
    $("homeLead").textContent = `선택한 주제에서 ${QUESTION_COUNT}문제가 출제됩니다.`;
    const list = $("subjectList");
    list.replaceChildren();
    if(!quizData.length){
      list.textContent = "표시할 주제가 없습니다.";
      return;
    }
    quizData.forEach(s=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "subject";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = s.subject;
      b.append(name);
      b.addEventListener("click", ()=>start(s));
      list.append(b);
    });
  }
  
  function start(subject){
    const count = Math.min(QUESTION_COUNT, subject.questions.length);
    state = {
      subject: subject.subject,
      questions: shuffle(subject.questions).slice(0,count),
      index: 0, score: 0, answered: false
    };
    show("quiz");
    renderQuestion();
  }
  
  function renderQuestion(){
    const total = state.questions.length;
    const q = state.questions[state.index];
    state.answered = false;
    $("qSubject").textContent = state.subject;
    $("qCount").textContent = `${state.index+1} / ${total}`;
    $("bar").style.width = `${((state.index+1)/total)*100}%`;
    $("qText").textContent = q.name;
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("nextBtn").hidden = true;
  
    const ul = $("options");
    ul.replaceChildren();
    q.answers.forEach((a,i)=>{
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "option";
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = LETTERS[i] || i+1;
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = a.content;
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.setAttribute("aria-hidden","true");
      b.append(letter,label,mark);
      b.addEventListener("click", ()=>choose(i));
      li.append(b);
      ul.append(li);
    });
  }
  
  function choose(i){
    if(state.answered) return;
    state.answered = true;
    const q = state.questions[state.index];
    const correctIdx = q.answers.findIndex(a=>a.isAnswer);
    const buttons = $("options").querySelectorAll(".option");
    const isRight = (i === correctIdx);
    if(isRight) state.score++;
  
    buttons.forEach((b,k)=>{
      b.disabled = true;
      const mark = b.querySelector(".mark");
      if(k === correctIdx){
        b.classList.add("correct");
        mark.textContent = "✓";
      }else if(k === i){
        b.classList.add("wrong");
        mark.textContent = "✕";
      }else{
        b.classList.add("dim");
      }
    });
  
    const fb = $("feedback");
    fb.className = "feedback " + (isRight ? "ok" : "err");
    fb.textContent = isRight
      ? "정답입니다."
      : `오답입니다. 정답은 ${LETTERS[correctIdx] || correctIdx+1}입니다.`;
  
    const last = state.index === state.questions.length-1;
    const next = $("nextBtn");
    next.textContent = last ? "결과 보기" : "다음 문제";
    next.hidden = false;
    next.focus({preventScroll:true});
  }
  
  function showResult(){
    const total = state.questions.length;
    const need = Math.min(PASS_SCORE, total);
    const pass = state.score >= need;
    const badge = $("badge");
    badge.className = "badge " + (pass ? "pass" : "fail");
    badge.textContent = pass ? "✓" : "✕";
    $("resultTitle").textContent = pass ? "성공" : "실패";
    $("resultScore").textContent = `${total}문제 중 ${state.score}문제를 맞혔습니다.`;
    $("resultRule").textContent = `${need}문제 이상 맞히면 성공입니다.`;
    show("result");
    $("homeBtn").focus({preventScroll:true});
  }
  
  $("nextBtn").addEventListener("click", ()=>{
    if(state.index >= state.questions.length-1){
      showResult();
    }else{
      state.index++;
      renderQuestion();
    }
  });
  $("homeBtn").addEventListener("click", ()=>{
    state = null;
    show("home");
  });
  
  renderHome();
  </script>
</body>
</html>
